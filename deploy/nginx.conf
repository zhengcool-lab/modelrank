# ModelRank reverse proxy.
#   /            -> Next.js (web:3000)
#   /api/        -> NestJS (api:3001), prefix stripped
#   /healthz     -> NestJS health endpoint
#   /_next/static -> Next.js build assets (long-cache)

upstream mr_web {
    server web:3000;
}

upstream mr_api {
    server api:3001;
}

# Gzip common text responses.
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
gzip_min_length 1024;

server {
    listen 80;
    server_name _; # replaced by the real domain after ICP filing; see docs/deploy-alibaba.md

    # Allow large JSON payloads from the eval/upload endpoints.
    client_max_body_size 25m;

    # ACME / certbot webroot — must stay before the /api and / catch-alls.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Container-level health probe used by the load balancer / uptime checks.
    location = /healthz {
        proxy_pass http://mr_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # Next.js hashed build assets — immutable, long cache.
    location /_next/static/ {
        proxy_pass http://mr_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API: /api/foo -> http://api:3001/foo  (trailing slash strips the prefix).
    location /api/ {
        proxy_pass http://mr_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Everything else goes to the Next.js app (SSR, RSC, static pages).
    location / {
        proxy_pass http://mr_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

